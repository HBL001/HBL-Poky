# =============================================================================
# extra-configs.cfg — trimmed for minimal boot + required peripherals
# =============================================================================

# --- General networking (disable on-board Ethernet + PRU) --------------------
CONFIG_NET=y                          # enable core networking
CONFIG_TI_CPSW=n                      # disable TI CPSW Ethernet switch
CONFIG_DAVINCI_MDIO=n                 # disable MDIO controller
CONFIG_MDIO=n                         # disable generic MDIO bus driver
CONFIG_PHYLIB=n                       # disable PHY library
CONFIG_TI_PRUSS=n                     # disable TI PRU-ICSS Subsystem

# --- Networking extras not needed --------------------------------------------
CONFIG_IPV6=n                         # no IPv6 support
CONFIG_PTP_1588_CLOCK=n               # no IEEE-1588 PTP clock
CONFIG_BRIDGE=n                       # no Ethernet bridging

# --- USB (gadget + host) -----------------------------------------------------
CONFIG_USB_GADGET=y                   # enable USB gadget framework
CONFIG_USB_LIBCOMPOSITE=y             # enable libcomposite for configfs
CONFIG_USB_CONFIGFS=y                 # enable configfs support
CONFIG_USB_CONFIGFS_RNDIS=y           # enable RNDIS gadget on usb0
CONFIG_USB_CONFIGFS_MASS_STORAGE=n    # disable mass-storage gadget
CONFIG_USB_GADGET_MASS_STORAGE=n      # disable legacy gadget mass-storage
CONFIG_USB_GADGET_SERIAL=n            # disable serial-port gadget
CONFIG_USB_HID=n                      # disable USB HID gadget
CONFIG_USB_MUSB_HDRC=y                # enable MUSB HDRC dual-role controller
CONFIG_USB_STORAGE=y                  # enable USB-host storage (memory sticks)

# --- SPI & FT800 graphics offload --------------------------------------------
CONFIG_SPI=y                          # enable SPI support
CONFIG_FT800=y                        # enable FT800 graphics engine
CONFIG_TOUCHSCREEN_ADS7846=n          # disable ADS7846/TSC2046 touchscreen
CONFIG_TOUCHSCREEN_TSC2046=n          # disable TSC2046 touchscreen

# --- I²C / GPIO / Pinctrl / Device Tree -------------------------------------
CONFIG_I2C=y                          # enable I²C support
CONFIG_I2C_CHARDEV=y                  # enable /dev/i2c-* entries
CONFIG_GPIOLIB=y                      # enable GPIO subsystem
CONFIG_PINCTRL=y                      # enable pinctrl subsystem
CONFIG_OF=y                           # enable FDT/OF support
CONFIG_OF_GPIO=y                      # enable GPIO lookup via DT
CONFIG_OF_DEVICE=y                    # enable OF-based platform devices

# --- RTC core & DS1302 bit-bang driver --------------------------------------
CONFIG_RTC_LIB=y                       # enable RTC core
CONFIG_RTC_CLASS=y                     # enable RTC class
CONFIG_RTC_HCTOSYS=y                   # set system time from RTC at boot
CONFIG_RTC_SYSTOHC=y                   # set RTC from system time at shutdown
CONFIG_RTC_HCTOSYS_DEVICE="rtc0"       # RTC device for hctosys
CONFIG_RTC_SYSTOHC_DEVICE="rtc0"       # RTC device for systohc
CONFIG_RTC_DRV_OMAP=n                  # disable on-SoC RTC core
CONFIG_RTC_DRV_DS1302_GPIO=y           # enable GPIO bit-bang DS1302
CONFIG_RTC_DRV_DS1302=n                # disable SPI DS1302 driver
CONFIG_RTC_DEBUG=y                     # enable RTC debug hooks

# --- Filesystems & Storage --------------------------------------------------
CONFIG_EXT4_FS=y                       # enable ext4 filesystem
CONFIG_BTRFS_FS=n                      # disable Btrfs filesystem
CONFIG_NFS_FS=n                        # disable NFS filesystem
CONFIG_CIFS=n                          # disable CIFS filesystem
CONFIG_FUSE_FS=n                       # disable FUSE filesystem

# --- RAID/SCSI/Block devices ------------------------------------------------
CONFIG_MD=n                           # disable MD (software RAID)
CONFIG_BLK_DEV_LOOP=n                 # disable loopback block device
CONFIG_BLK_DEV_BSG=n                  # disable block layer SCSI generic

# --- RNG (on-chip) -----------------------------------------------------------
CONFIG_OMAP_RNG=y                      # enable on-chip RNG

# --- Debug -------------------------------------------------------------------
CONFIG_DEBUG_FS=y                      # enable debugfs

# --- Audio (McASP) ----------------------------------------------------------
 CONFIG_SND_SOC_AM335X_I2S=n           # disable McASP I²S audio driver

# --- Power management (PMIC) ------------------------------------------------
CONFIG_REGULATOR_TPS65217=y           #  TPS65217 PMIC driver
CONFIG_INPUT=y			      #  Enable power button on casing	
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_MISC=y
CONFIG_KEYBOARD_TPS65217=y

# --- Serial support drivers  ------------------------------------------------
CONFIG_SERIAL_CORE=y                  # UART driver core
CONFIG_SERIAL_DEV_BUS=y               # UART devices on bus
CONFIG_SERIAL_AMBA_PL011=y            # on-SoC PL011 UART support
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y    # use PL011 as console

